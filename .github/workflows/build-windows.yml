# build-windows.yml - the Windows package (docs/release-windows.md). The build job makes
# Homeworld-Infection-<version>-Windows-Setup.exe on Ubuntu (tools/release/build-windows.sh) and uploads it as the
# artifact package-windows; the smoke job installs, starts and uninstalls it on Windows
# (tools/release/windows/smoke-test.ps1). The release workflow calls it (workflow_call). No game data is used.
name: build-windows

on:
  push:
    branches: [ci/windows]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: build the installer
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install the build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build pkg-config nsis make unzip xz-utils binutils

      # the downloads (pinned by sha256) and the FFmpeg build; the extracted toolchains are not cached
      - name: Third-party cache
        uses: actions/cache@v4
        with:
          path: |
            build/win-deps/dl
            build/win-deps/ffmpeg-mingw
          key: win-deps-v1-${{ hashFiles('tools/release/windows/pins.env', 'tools/release/ffmpeg-min.sh') }}
          restore-keys: win-deps-v1-

      - name: Build
        run: tools/release/build-windows.sh --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: package-windows
          path: dist/Homeworld-Infection-*-Windows-Setup.exe
          if-no-files-found: error
          compression-level: 0

  smoke:
    name: smoke test on Windows
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/release/windows

      - uses: actions/download-artifact@v4
        with:
          name: package-windows
          path: pkg

      - name: Install, start, uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path pkg -Filter 'Homeworld-Infection-*-Windows-Setup.exe' | Select-Object -First 1
          if (-not $setup) { throw 'no installer in the artifact' }
          ./tools/release/windows/smoke-test.ps1 -Setup $setup.FullName
