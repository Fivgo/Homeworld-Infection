# Meson cross file: Windows x86-64 (llvm-mingw, UCRT) for hwi-engine (docs/m3-windows-build.md).
# It needs two constants from a machine file passed BEFORE it on the command line (tools/release_win64.sh writes
# build/win64-paths.ini):
#   [constants]
#   llvm_mingw = '/path/to/llvm-mingw-<date>-ucrt-ubuntu-22.04-x86_64'   (github.com/mstorsjo/llvm-mingw)
#   sdl2_mingw = '/path/to/SDL2-2.30.x/x86_64-w64-mingw32'               (libsdl.org SDL2-devel-2.30.x-mingw.tar.gz)
# meson setup build/win64 --cross-file build/win64-paths.ini --cross-file tools/cross/x86_64-w64-mingw32.ini ...

[binaries]
c = llvm_mingw / 'bin/x86_64-w64-mingw32-clang'
ar = llvm_mingw / 'bin/llvm-ar'
strip = llvm_mingw / 'bin/llvm-strip'
windres = llvm_mingw / 'bin/x86_64-w64-mingw32-windres'
# the SDL2 tarball's sdl2.pc names its build machine's prefix (/tmp/tardir/...): --define-prefix re-derives it from
# the .pc file's own location
pkg-config = ['pkg-config', '--define-prefix']

[properties]
pkg_config_libdir = sdl2_mingw / 'lib/pkgconfig'

[host_machine]
system = 'windows'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
